<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Lumos">
  <defs>
    <radialGradient id="wash" cx="256" cy="274" r="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.22" />
      <stop offset="0.55" stop-color="#fb7185" stop-opacity="0.06" />
      <stop offset="1" stop-color="#fb7185" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="spark" x1="256" y1="230" x2="256" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff1f2" />
      <stop offset="1" stop-color="#fda4af" />
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Full-bleed canvas so maskable crops never expose transparent corners. -->
  <rect width="512" height="512" fill="#09090b" />
  <rect width="512" height="512" fill="url(#wash)" />

  <g transform="translate(0 19)" fill="none" stroke="#fb7185" stroke-linecap="round" stroke-linejoin="round">
    <path d="M226 150a30 30 0 0 1 60 0" stroke-width="10" />
    <rect x="210" y="150" width="92" height="20" rx="6" stroke-width="10" />
    <rect x="196" y="170" width="120" height="172" rx="40" stroke-width="10" fill="#fb7185" fill-opacity="0.06" />
    <rect x="216" y="342" width="80" height="14" rx="6" stroke-width="10" />
  </g>

  <path
    d="M256 231C260 260 266 270 286 275C266 280 260 290 256 319C252 290 246 280 226 275C246 270 252 260 256 231Z"
    fill="url(#spark)"
    filter="url(#glow)"
  />
</svg>
